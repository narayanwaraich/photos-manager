[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = false
no-default-features = false

[advisories]
ignore = [
    # libsqlite3-sys 0.30.1 bundled by sqlx-sqlite 0.8.6 (CVE-2026-119375).
    # Application accesses internal database only, not untrusted external SQLite DBs with crafted WALs.
    "RUSTSEC-2026-0459",
]
unmaintained = "all"
unsound = "workspace"
yanked = "warn"

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = [
    "https://github.com/kuma-00/libvips-rust-bindings-for-windows.git",
]
