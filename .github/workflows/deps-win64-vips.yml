name: Build & Test Windows x64 libvips (HEVC Decode)

on:
  workflow_dispatch:
  push:
    branches:
      - 'task/0E'
    paths:
      - '.github/workflows/deps-win64-vips.yml'
      - 'deps/win64-vips/**'

permissions:
  contents: read

jobs:
  build-zip:
    name: Build Windows x64 libvips (Linux container)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone upstream build-win64-mxe at pinned commit
        run: |
          git clone https://github.com/libvips/build-win64-mxe.git upstream-build
          cd upstream-build
          git checkout 09cfccf20b91b441fbe97fa7a7ed8a597e55e830
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "Checked out upstream commit: $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "09cfccf20b91b441fbe97fa7a7ed8a597e55e830" ]; then
            echo "❌ Upstream commit mismatch: expected 09cfccf20b91b441fbe97fa7a7ed8a597e55e830, got $ACTUAL_SHA"
            exit 1
          fi

      - name: Apply patches
        run: |
          cd upstream-build
          rm -f build/plugins/hevc-deps/patches/x265-*.patch
          for p in ../deps/win64-vips/patches/*.patch; do
            echo "Applying patch: $p"
            patch -p1 < "$p"
          done
          git status
          git diff

      - name: Build Windows x64 vips-web with HEVC decode
        run: |
          cd upstream-build
          ./build.sh --with-hevc -t x86_64-w64-mingw32.shared vips-web

      - name: Audit artifact and check licensing
        run: |
          sudo chmod -R 777 upstream-build/packaging
          ZIP_FILE=$(find upstream-build/packaging -name "vips-dev-x64-web-*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Build artifact not found in upstream-build/packaging/"
            exit 1
          fi
          echo "Found build artifact: $ZIP_FILE"
          sha256sum "$ZIP_FILE"
          unzip -l "$ZIP_FILE"

          chmod +x deps/win64-vips/audit-zip.sh
          ./deps/win64-vips/audit-zip.sh "$ZIP_FILE"

          # Move artifact for staging
          cp "$ZIP_FILE" "$GITHUB_WORKSPACE/vips-dev-x64-web-8.18.6-hevc.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vips-win64-hevc
          path: vips-dev-x64-web-8.18.6-hevc.zip
          retention-days: 14
          if-no-files-found: error

  test-windows:
    name: Test HEIC decode & SVG control on Windows
    needs: build-zip
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built libvips artifact
        uses: actions/download-artifact@v4
        with:
          name: vips-win64-hevc
          path: C:\vips-art

      - name: Verify libvips CLI, HEIC decode and SVG blocking
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-ChildItem -Path "C:\vips-art\*.zip").FullName | Select-Object -First 1
          echo "Testing artifact: $zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          echo "SHA256: $hash"

          $extractDir = "C:\vips"
          New-Item -ItemType Directory -Path $extractDir -Force
          tar.exe -xf $zip -C $extractDir --strip-components=1
          $vipsBin = "$extractDir\bin"
          $vipsExe = "$vipsBin\vips.exe"
          $vipsThumb = "$vipsBin\vipsthumbnail.exe"

          # Reduce PATH to system basics + zip bin
          $origPath = $env:PATH
          $env:PATH = "C:\Windows\System32;C:\Windows;$vipsBin"

          echo "=== 1. Check vips.exe -l lists heifload ==="
          $loaders = (& $vipsExe -l | Out-String)
          Write-Host $loaders
          if ($loaders -notmatch "heifload") {
            throw "vips.exe -l does NOT list heifload!"
          }
          echo "✓ Success: vips.exe lists heifload"

          echo "=== 2. Decode HEIC fixture to PNG and check dimensions ==="
          $heicFixture = "tests\fixtures\generated\image_orientation_6.heic"
          $outPng = "$env:RUNNER_TEMP\heic_test.png"
          # Orientation 6 source 640x480 -> thumbnail upright 240x320
          & $vipsThumb $heicFixture -s 320 -o $outPng
          if ($LASTEXITCODE -ne 0) {
            throw "vipsthumbnail failed to decode $heicFixture with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $outPng)) {
            throw "Output PNG was not created"
          }
          # Verify dimensions with vipsheader
          $header = (& "$vipsBin\vipsheader.exe" $outPng | Out-String)
          Write-Host "Output thumbnail header: $header"
          if ($header -notmatch "240x320") {
            throw "Thumbnail dimensions mismatch: expected 240x320, got $header"
          }

          $outCopyPng = "$env:RUNNER_TEMP\heic_copy.png"
          & $vipsExe copy $heicFixture $outCopyPng
          if ($LASTEXITCODE -ne 0) {
            throw "vips copy failed to decode $heicFixture with exit code $LASTEXITCODE"
          }
          $headerCopy = (& "$vipsBin\vipsheader.exe" $outCopyPng | Out-String)
          Write-Host "Output vips copy header: $headerCopy"
          # sips encoded an irot box (Rotate 90 CW), so heifload applies the rotation on load (480x640)
          if ($headerCopy -notmatch "480x640") {
            throw "vips copy dimensions mismatch: expected 480x640, got $headerCopy"
          }
          echo "✓ Success: HEIC decoded to upright 240x320 (thumb) and 480x640 (copy)!"

          echo "=== 2b. Decode Display P3 HEIC fixture ==="
          $p3Fixture = "tests\fixtures\generated\image_display_p3.heic"
          $outP3Copy = "$env:RUNNER_TEMP\p3_copy.png"
          & $vipsExe copy $p3Fixture $outP3Copy
          if ($LASTEXITCODE -ne 0) {
            throw "vips copy failed to decode $p3Fixture with exit code $LASTEXITCODE"
          }
          $headerP3 = (& "$vipsBin\vipsheader.exe" $outP3Copy | Out-String)
          Write-Host "Output P3 copy header: $headerP3"
          if ($headerP3 -notmatch "640x480") {
            throw "P3 copy dimensions mismatch: expected 640x480, got $headerP3"
          }

          $outP3Thumb = "$env:RUNNER_TEMP\p3_thumb.png"
          & $vipsThumb $p3Fixture -s 320 -o $outP3Thumb
          if ($LASTEXITCODE -ne 0) {
            throw "vipsthumbnail failed to decode $p3Fixture with exit code $LASTEXITCODE"
          }
          $headerP3Thumb = (& "$vipsBin\vipsheader.exe" $outP3Thumb | Out-String)
          Write-Host "Output P3 thumb header: $headerP3Thumb"
          if ($headerP3Thumb -notmatch "320x240") {
            throw "P3 thumb dimensions mismatch: expected 320x240, got $headerP3Thumb"
          }
          echo "✓ Success: Display P3 HEIC decoded to 640x480 (copy) and 320x240 (thumb)!"

          echo "=== 3. SVG untrusted loader block control ==="
          $svgFixture = "tests\fixtures\generated\fixture_blocked.svg"
          # Unblocked loads it
          & $vipsExe copy $svgFixture "$env:RUNNER_TEMP\svg_allowed.png"
          if ($LASTEXITCODE -ne 0) {
            throw "Control failure: vips.exe failed to copy SVG when unblocked"
          }
          echo "✓ Success: SVG loaded when unblocked"

          # Blocked with VIPS_BLOCK_UNTRUSTED=1
          $env:VIPS_BLOCK_UNTRUSTED = "1"
          $svgBlockOut = & $vipsExe copy $svgFixture "$env:RUNNER_TEMP\svg_blocked.png" 2>&1 | Out-String
          $svgBlockExit = $LASTEXITCODE
          $env:VIPS_BLOCK_UNTRUSTED = $null
          Write-Host $svgBlockOut
          if ($svgBlockExit -eq 0) {
            throw "Control failure: vips.exe loaded SVG despite VIPS_BLOCK_UNTRUSTED=1"
          }
          if ($svgBlockOut -notmatch "not a known file format") {
            throw "Expected error containing 'not a known file format'"
          }
          echo "✓ Success: SVG blocked under VIPS_BLOCK_UNTRUSTED=1 with code $svgBlockExit"

          $env:PATH = $origPath
