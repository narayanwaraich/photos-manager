name: CI & Packaging Matrix

on:
  push:
    branches:
      - main
      - 'task/**'
    paths-ignore:
      - 'docs/**'
      - 'reports/**'
      - 'tasks/**'
      - '**/*.md'
      - '.github/workflows/deps-win64-vips.yml'
      - 'deps/win64-vips/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'reports/**'
      - 'tasks/**'
      - '**/*.md'
      - '.github/workflows/deps-win64-vips.yml'
      - 'deps/win64-vips/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security & License check (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Security & License policy check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          manifest-path: src-tauri/Cargo.toml

  windows-x64:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Pillow
        run: python -m pip install pillow

      - name: Install Windows prerequisites
        shell: pwsh
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          $ErrorActionPreference = 'Stop'
          # 1. Download and checksum libvips distribution (fail closed on non-fork runs; stock fallback for fork PRs only)
          New-Item -ItemType Directory -Path deps\vips -Force

          if ($env:IS_FORK_PR -eq 'true') {
            echo "Fork pull request detected; using stock upstream libvips (no HEVC decode, REQUIRE_HEIC unset)..."
            $vipsUrl = "https://github.com/libvips/build-win64-mxe/releases/download/v8.18.6/vips-dev-x64-web-8.18.6.zip"
            curl.exe -fL --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o vips.zip $vipsUrl
            if ($LASTEXITCODE -ne 0) {
              throw "download failed after retries: $vipsUrl"
            }
            $expectedHash = "10086F2CCC8E2A861831FACABAB75FA1B80B4BD03F0A8447623EC581002AA4B2"
            $vipsHash = (Get-FileHash vips.zip -Algorithm SHA256).Hash
            if ($vipsHash -ne $expectedHash) {
              throw "Checksum mismatch for stock vips.zip: expected $expectedHash, got $vipsHash"
            }
            echo "✓ Verified stock libvips hash: $vipsHash"
          } else {
            $depsToken = $env:DEPS_TOKEN
            if ([string]::IsNullOrWhiteSpace($depsToken)) {
              throw "DEPS_TOKEN is required for non-fork runs but was missing or empty. Check repository secret DEPS_TOKEN (is it missing, expired, or lacking Contents read access?)."
            }

            $releaseRepo = "narayanwaraich/photos-manager-deps"
            $releaseTag = "win64-vips-8.18.6-hevc1"
            $maxAttempts = 3
            $vipsDownloaded = $false
            $lastError = ""
            $env:GH_TOKEN = $depsToken

            try {
              echo "Downloading custom HEVC libvips release '$releaseTag' from '$releaseRepo'..."
              for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
                Remove-Item -Force "vips-dev-x64-web-*.zip", "vips.zip" -ErrorAction SilentlyContinue
                gh release download $releaseTag --repo $releaseRepo --pattern '*.zip' --dir .
                $dlExit = $LASTEXITCODE
                if ($dlExit -eq 0) {
                  $zipItem = Get-ChildItem -Path "vips-dev-x64-web-*.zip" -File | Select-Object -First 1
                  if ($zipItem) {
                    Move-Item $zipItem.FullName "vips.zip" -Force
                    $vipsDownloaded = $true
                    break
                  }
                  $lastError = "gh release download exited 0 but no vips-dev-x64-web-*.zip file was found"
                } else {
                  $lastError = "gh release download failed with exit code $dlExit"
                }
                echo "Attempt $attempt of $maxAttempts failed: $lastError"
                if ($attempt -lt $maxAttempts) {
                  Start-Sleep -Seconds 15
                }
              }
            } finally {
              $env:GH_TOKEN = $null
            }

            if (-not $vipsDownloaded) {
              throw "Failed to download custom HEVC libvips release '$releaseTag' from '$releaseRepo' after $maxAttempts attempts ($lastError). Check whether DEPS_TOKEN is expired/invalid, lacks Contents read permission on '$releaseRepo', or release tag '$releaseTag' is missing."
            }

            $expectedHash = "72591A6BDF775618BC154E83990C86919ECB18F6E9D72FADE5BAEF9B4F343991"
            $vipsHash = (Get-FileHash vips.zip -Algorithm SHA256).Hash
            if ($vipsHash -ne $expectedHash) {
              throw "Checksum mismatch for custom vips.zip: expected $expectedHash, got $vipsHash"
            }
            echo "✓ Verified custom HEVC libvips hash: $vipsHash"
            Add-Content -Path $env:GITHUB_ENV -Value "REQUIRE_HEIC=1" -Encoding utf8
          }

          tar.exe -xf vips.zip -C deps\vips --strip-components=1

          # Ensure link libraries match rustc cargo:rustc-link-lib requests (both with and without lib prefix)
          Copy-Item "deps\vips\lib\libvips.lib" "deps\vips\lib\vips.lib" -Force -ErrorAction SilentlyContinue
          Copy-Item "deps\vips\lib\libglib-2.0.lib" "deps\vips\lib\glib-2.0.lib" -Force -ErrorAction SilentlyContinue
          Copy-Item "deps\vips\lib\libgobject-2.0.lib" "deps\vips\lib\gobject-2.0.lib" -Force -ErrorAction SilentlyContinue

          # 2. Download and checksum ExifTool 13.61 standalone distribution
          New-Item -ItemType Directory -Path deps\exiftool -Force
          $exifUrl = "https://downloads.sourceforge.net/project/exiftool/exiftool-13.61_64.zip"
          curl.exe -fL --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o exiftool.zip $exifUrl
          if ($LASTEXITCODE -ne 0) {
            throw "download failed after retries: $exifUrl"
          }
          $exifHash = (Get-FileHash exiftool.zip -Algorithm SHA256).Hash
          if ($exifHash -ne "AB75B37515385A753AA60A58F68FFFFE1FF81E43B319DF9540978FB19E0580E5") {
            throw "Checksum mismatch for exiftool.zip: expected AB75B37515385A753AA60A58F68FFFFE1FF81E43B319DF9540978FB19E0580E5, got $exifHash"
          }
          tar.exe -xf exiftool.zip -C deps\exiftool --strip-components=1
          if (Test-Path "deps\exiftool\exiftool(-k).exe") {
            Move-Item "deps\exiftool\exiftool(-k).exe" "deps\exiftool\exiftool.exe" -Force
          }

          # 3. Export environment paths
          $vipsLib = "$PWD\deps\vips\lib"
          $vipsBin = "$PWD\deps\vips\bin"
          $exifDir = "$PWD\deps\exiftool"
          $pkgConfigDir = "$PWD\deps\vips\lib\pkgconfig"
          Add-Content -Path $env:GITHUB_ENV -Value "VIPS_LIB_DIR=$vipsLib" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "VIPS_DIR=$PWD\deps\vips" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "EXIFTOOL_DIR=$exifDir" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$pkgConfigDir" -Encoding utf8
          Add-Content -Path $env:GITHUB_PATH -Value "$vipsBin" -Encoding utf8
          Add-Content -Path $env:GITHUB_PATH -Value "$exifDir" -Encoding utf8

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate synthetic test fixtures
        run: python scripts/generate-fixtures.py

      - name: Run verification suite (pnpm verify)
        run: pnpm verify

      - name: Stage bundled resources
        run: node scripts/prepare-bundle.mjs

      - name: Build Tauri application (unsigned)
        run: pnpm tauri build --bundles nsis

      - name: Post-build bundle packaging & library relocation
        run: node scripts/package-bundle.mjs

      - name: Clean-environment smoke test (Windows x64)
        shell: pwsh
        run: |
          # 0. Record host system prerequisites
          echo "=== Windows Host System Prerequisites ==="
          reg query "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled
          $vcExists = Test-Path "C:\Windows\System32\vcruntime140.dll"
          echo "C:\Windows\System32\vcruntime140.dll exists: $vcExists"

          # 1. Locate NSIS installer artifact produced by tauri build
          $installer = (Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*.exe").FullName | Select-Object -First 1
          if (-not $installer) {
            echo "❌ NSIS installer not found in bundle\nsis"
            exit 1
          }
          echo "Testing installer package: $installer"

          # 2. Extract / install bundle to fresh directory outside target/
          $installDir = "C:\smoke-extracted"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          New-Item -ItemType Directory -Path $installDir -Force

          Start-Process -FilePath $installer -ArgumentList "/S /D=$installDir" -Wait
          if (-not (Test-Path "$installDir\photos-manager.exe")) {
            echo "Using 7z extraction fallback for NSIS bundle..."
            7z x $installer -o"$installDir" -y
            if (Test-Path "$installDir\`$INSTDIR\photos-manager.exe") {
              Copy-Item "$installDir\`$INSTDIR\*" "$installDir\" -Recurse -Force
            }
          }

          if (-not (Test-Path "$installDir\photos-manager.exe")) {
            echo "❌ Executable not found in installed bundle at $installDir\photos-manager.exe"
            exit 1
          }
          Get-ChildItem -Path $installDir

          # 2.5 Verify libvips CLI untrusted loader control test (using deps\vips\bin\vips.exe)
          $vipsExe = "deps\vips\bin\vips.exe"
          echo "=== CLI Control Test 1: vips.exe copy without VIPS_BLOCK_UNTRUSTED (must succeed) ==="
          & $vipsExe copy tests\fixtures\generated\fixture_blocked.svg "$env:RUNNER_TEMP\svg_control_allowed.png"
          if ($LASTEXITCODE -ne 0) {
            echo "❌ Control failure: vips.exe failed to copy SVG when unblocked"
            exit 1
          }
          echo "✓ Success: vips.exe copy succeeded when unblocked"

          echo "=== CLI Control Test 2: vips.exe copy with VIPS_BLOCK_UNTRUSTED=1 (must fail) ==="
          $env:VIPS_BLOCK_UNTRUSTED = "1"
          $cliBlockOutput = & $vipsExe copy tests\fixtures\generated\fixture_blocked.svg "$env:RUNNER_TEMP\svg_control_blocked.png" 2>&1 | Out-String
          $cliBlockExit = $LASTEXITCODE
          $env:VIPS_BLOCK_UNTRUSTED = $null
          Write-Host $cliBlockOutput
          if ($cliBlockExit -eq 0) {
            echo "❌ Control failure: vips.exe loaded SVG despite VIPS_BLOCK_UNTRUSTED=1"
            exit 1
          }
          if ($cliBlockOutput -notmatch "not a known file format") {
            echo "❌ Expected error message containing 'not a known file format'"
            exit 1
          }
          echo "✓ Success: vips.exe rejected SVG under VIPS_BLOCK_UNTRUSTED=1 with code $cliBlockExit"

          # 2.6 ExifTool child process spawning measurement
          echo "=== Measuring Windows ExifTool process tree in stay_open mode ==="
          $exiftoolExe = "$installDir\resources\exiftool\exiftool.exe"
          if (Test-Path $exiftoolExe) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exiftoolExe
            $psi.Arguments = "-stay_open True -@ -"
            $psi.RedirectStandardInput = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.UseShellExecute = $false
            $p = [System.Diagnostics.Process]::Start($psi)
            Start-Sleep -Seconds 2
            $children = Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $p.Id } | Select-Object Name,ProcessId
            echo "Parent process: $($p.ProcessName) (PID: $($p.Id))"
            echo "Child processes spawned by exiftool.exe:"
            if ($children) {
              $children | Format-Table -AutoSize | Out-String | Write-Host
            } else {
              echo "No child processes detected (exiftool is single process)."
            }
            # Terminate stay_open session
            $p.StandardInput.WriteLine("-stay_open")
            $p.StandardInput.WriteLine("False")
            $p.StandardInput.Flush()
            $exited = $p.WaitForExit(3000)
            if (-not $exited) {
              $p.Kill()
            }
          } else {
            echo "exiftool.exe not found at $exiftoolExe"
          }

          # 3. Print DLL imports of installed photos-manager.exe and all installed DLLs using dumpbin
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter "dumpbin.exe" -Recurse | Where-Object { $_.FullName -match "bin\\Hostx64\\x64\\dumpbin\.exe" } | Select-Object -First 1 -ExpandProperty FullName
          if ($dumpbin) {
            echo "=== DLL Dependencies of installed photos-manager.exe (dumpbin /dependents) ==="
            & $dumpbin /dependents "$installDir\photos-manager.exe"

            echo "=== Auditing all top-level installed DLLs for VC++ runtime dependencies ==="
            $installedDlls = Get-ChildItem -Path $installDir -Filter "*.dll" -File
            $dllCount = $installedDlls.Count
            echo "Total top-level installed DLLs scanned: $dllCount"

            $vcMatches = @()
            foreach ($dll in $installedDlls) {
              $deps = & $dumpbin /dependents $dll.FullName | Out-String
              $matched = [regex]::Matches($deps, "(?i)(vcruntime\S*|msvcp\S*|vcomp\S*|concrt\S*)") | ForEach-Object { $_.Value } | Select-Object -Unique
              if ($matched) {
                $vcMatches += [PSCustomObject]@{
                  DLL = $dll.Name
                  VCRuntimeImports = ($matched -join ", ")
                }
              }
            }

            if ($vcMatches.Count -gt 0) {
              echo "WARNING: The following DLLs import Visual C++ runtime:"
              $vcMatches | Format-Table -AutoSize | Out-String | Write-Host
            } else {
              echo "SUCCESS: 0 out of $dllCount installed DLLs import VC++ runtimes (clean Universal CRT / system only)."
            }
            echo "Note: The ExifTool Strawberry Perl runtime DLLs under resources\exiftool\exiftool_files\ were not included in this top-level scan."
          } else {
            echo "dumpbin.exe not found via vswhere"
          }

          # 4. Execute in stripped clean environment (only system32/windows on PATH, no vips/perl/exiftool, no bypass)
          $origPath = $env:PATH
          $env:PATH = "C:\Windows\System32;C:\Windows;C:\Windows\System32\Wbem"
          $proc = Start-Process -FilePath "$installDir\photos-manager.exe" -ArgumentList @("--smoke-test", "--out", "smoke-windows-x64.json") -NoNewWindow -Wait -PassThru
          $exitCode = $proc.ExitCode
          $env:PATH = $origPath

          Get-Content smoke-windows-x64.json
          if ($exitCode -ne 0) {
            echo "❌ Clean-environment smoke test failed with code $exitCode"
            exit $exitCode
          }

          $smoke = Get-Content smoke-windows-x64.json | ConvertFrom-Json
          echo "Smoke test heic_decode_verified: $($smoke.heic_decode_verified)"
          echo "Smoke test heic_note: $($smoke.heic_note)"
          if ($env:REQUIRE_HEIC -eq "1" -and -not $smoke.heic_decode_verified) {
            echo "❌ REQUIRE_HEIC=1 was set, but heic_decode_verified is false!"
            exit 1
          }

      - name: Upload smoke test report
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-windows-x64
          path: smoke-*.json
          retention-days: 14

      - name: Upload verification logs
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs-windows-x64
          path: reports/logs/
          retention-days: 14

      - name: Upload Windows installer package (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: photos-manager-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 3
          if-no-files-found: error

  macos-arm64:
    name: macos-arm64
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Pillow
        run: python -m pip install pillow

      - name: Install macOS prerequisites
        run: |
          brew install vips pkg-config
          # Download and checksum official ExifTool 13.61 distribution
          curl -fL --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o exiftool.tar.gz https://downloads.sourceforge.net/project/exiftool/Image-ExifTool-13.61.tar.gz
          echo "df7f42c14b4f58a60bec39feae0ee9593000ee27e44920d2b0a21c6627de0baa  exiftool.tar.gz" | shasum -a 256 -c -
          mkdir -p deps/exiftool
          tar -xzf exiftool.tar.gz -C deps/exiftool --strip-components=1
          echo "EXIFTOOL_DIR=$PWD/deps/exiftool" >> "$GITHUB_ENV"
          echo "$PWD/deps/exiftool" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate synthetic test fixtures
        run: python scripts/generate-fixtures.py

      - name: Run verification suite (pnpm verify)
        run: pnpm verify

      - name: Stage bundled resources
        run: node scripts/prepare-bundle.mjs

      - name: Build Tauri application (unsigned)
        env:
          PHOTOS_DEV_HOMEBREW: "1"
        run: pnpm tauri build --bundles app

      - name: Post-build bundle packaging & library relocation
        run: node scripts/package-bundle.mjs

      - name: Clean-environment smoke test (macOS arm64)
        run: |
          # 1. Unzip portable zip package to fresh testing folder outside target/
          ZIP_PATH="src-tauri/target/release/bundle/macos/photos-manager-macos-arm64.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "❌ Portable zip package not found at $ZIP_PATH"
            exit 1
          fi
          echo "Testing zip package: $ZIP_PATH"

          mkdir -p /tmp/smoke-extracted
          rm -rf /tmp/smoke-extracted/*
          unzip -q "$ZIP_PATH" -d /tmp/smoke-extracted/
          TEST_APP=$(find /tmp/smoke-extracted -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$TEST_APP" ]; then
            echo "❌ No .app bundle found in extracted archive"
            exit 1
          fi
          EXE_PATH="$TEST_APP/Contents/MacOS/photos-manager"
          chmod +x "$EXE_PATH"
          echo "Testing extracted bundle at: $TEST_APP"

          # 2. Check bundled dylib table in docs/native-dependencies.md §4.3
          echo "=== Verifying bundled dylib table against docs/native-dependencies.md §4.3 ==="
          node scripts/check-dylib-table.mjs "$TEST_APP"

          # 3. Verify libvips CLI untrusted loader control test (proves libvips honours VIPS_BLOCK_UNTRUSTED)
          echo "=== CLI Control Test 1: vips copy without VIPS_BLOCK_UNTRUSTED (must succeed) ==="
          vips copy tests/fixtures/generated/fixture_blocked.svg /tmp/svg_control_allowed.png
          test -f /tmp/svg_control_allowed.png
          echo "✓ Success: vips copy succeeded when unblocked"

          echo "=== CLI Control Test 2: vips copy with VIPS_BLOCK_UNTRUSTED=1 (must fail) ==="
          set +e
          CLI_BLOCK_OUTPUT=$(VIPS_BLOCK_UNTRUSTED=1 vips copy tests/fixtures/generated/fixture_blocked.svg /tmp/svg_control_blocked.png 2>&1)
          CLI_BLOCK_EXIT=$?
          set -e
          echo "$CLI_BLOCK_OUTPUT"
          if [ $CLI_BLOCK_EXIT -eq 0 ]; then
            echo "❌ Control failure: vips copy loaded SVG despite VIPS_BLOCK_UNTRUSTED=1"
            exit 1
          fi
          if ! echo "$CLI_BLOCK_OUTPUT" | grep -q "not a known file format"; then
            echo "❌ Expected error message containing 'not a known file format'"
            exit 1
          fi
          echo "✓ Success: vips copy rejected SVG under VIPS_BLOCK_UNTRUSTED=1 with code $CLI_BLOCK_EXIT"

          # 4. Verify otool -L for main binary and all bundled dylibs (expect zero Homebrew or /usr/local lines)
          echo "=== Checking otool -L on main binary for Homebrew / usr/local ==="
          otool -L "$EXE_PATH" | grep -E "/opt/homebrew|/usr/local" || echo "✓ Main binary clean: no Homebrew or /usr/local references"
          echo "=== Checking otool -L on all bundled dylibs ==="
          for lib in "$TEST_APP"/Contents/Frameworks/*.dylib; do
            LEAKS=$(otool -L "$lib" | grep -E "/opt/homebrew|/usr/local" || true)
            if [ -n "$LEAKS" ]; then
              echo "❌ Leak in $(basename "$lib"): $LEAKS"
              exit 1
            fi
          done
          echo "✓ All bundled dylibs clean: zero Homebrew or /usr/local references"

          # 5. Physically hide Homebrew on runner to prove complete hermeticity
          sudo mv /opt/homebrew /opt/homebrew.off

          # 6. Execute smoke test in stripped clean environment (no bypass flags)
          set +e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin "$EXE_PATH" --smoke-test --out smoke-macos-arm64.json
          SMOKE_EXIT=$?
          set -e

          # 7. Restore Homebrew
          sudo mv /opt/homebrew.off /opt/homebrew

          cat smoke-macos-arm64.json
          if [ $SMOKE_EXIT -ne 0 ]; then
            echo "❌ Clean-environment smoke test failed with code $SMOKE_EXIT"
            exit $SMOKE_EXIT
          fi

          # 8. Verify macOS reports heic_decode_verified == false with expected note (TASK-0E Part B)
          python3 -c "import json; d = json.load(open('smoke-macos-arm64.json')); assert d.get('heic_decode_verified') is False, 'Expected false'; assert d.get('heic_note') == 'not packaged yet (TASK-0F)', d.get('heic_note'); print('✓ Verified macOS smoke output: heic_decode_verified == false')"

      - name: Upload smoke test report
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-macos-arm64
          path: smoke-*.json
          retention-days: 14

      - name: Upload verification logs
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs-macos-arm64
          path: reports/logs/
          retention-days: 14

      - name: Upload macOS application bundle (zip)
        uses: actions/upload-artifact@v4
        with:
          name: photos-manager-macos-arm64
          path: src-tauri/target/release/bundle/macos/photos-manager-macos-arm64.zip
          retention-days: 3
          if-no-files-found: error
