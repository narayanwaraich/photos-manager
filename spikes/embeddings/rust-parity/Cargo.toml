[package]
name = "embedding-parity"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
flate2 = "1.1.11"
image = "0.25.10"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-31", "coreml", "directml"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
