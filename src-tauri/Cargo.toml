[package]
name = "photos-manager"
version = "0.1.0"
description = "Photos Manager"
authors = ["Photos Manager Authors"]
edition = "2021"

[lib]
name = "photos_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
libvips = "2.3.0"
thiserror = "2"
anyhow = "1"
http = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
