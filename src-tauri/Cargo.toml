[package]
name = "photos-manager"
version = "0.1.0"
description = "Photos Manager"
authors = ["Photos Manager Authors"]
edition = "2021"

[lib]
name = "photos_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
libvips = "1.7.2"
thiserror = "2"
anyhow = "1"
http = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[patch.crates-io]
libvips = { git = "https://github.com/kuma-00/libvips-rust-bindings-for-windows.git", rev = "80097ad9387180f678b21482b8b0cfbfb436a308" }
